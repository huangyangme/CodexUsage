name: Build macOS app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify app
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsage-macOS
          path: dist/CodexUsage.zip
